server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  etag on;

  # Root document should always revalidate.
  location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =404;
  }

  # Entry HTML must never be aggressively cached.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Flutter bootstrap must always be fetched fresh.
  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Flutter loader/runtime files should revalidate to avoid stale deployments.
  location ~* ^/(flutter\.js|main\.dart\.js|flutter_build_config\.json)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # JSON startup/config should revalidate on each load.
  location = /manifest.json {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* \.json$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Service worker should never be cached.
  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # JS/WASM entry/runtime artifacts should not be immutable-cached.
  location ~* \.(?:js|mjs|wasm)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Versioned/hash-like assets can be cached long-term.
  location ~* ^/(assets|canvaskit|icons)/.*[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f].*\.(?:css|svg|png|jpg|jpeg|gif|ico|webp|woff|woff2|ttf|otf)$ {
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # Non-versioned static assets should revalidate.
  location ~* \.(?:css|svg|png|jpg|jpeg|gif|ico|webp|woff|woff2|ttf|otf)$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Flutter SPA routing fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
